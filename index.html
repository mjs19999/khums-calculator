<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة الخمس</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root,
    [data-theme="light"] {
      --primary: #046A38;
      --primary-hover: #03552d;
      --primary-soft: rgba(4, 106, 56, 0.12);
      --accent: #D4AF37;

      --bg: #f8f9f7;
      --surface: #ffffff;
      --surface-2: #fcfcfb;
      --surface-3: #f2f4f1;
      --text: #1f2a22;
      --text-muted: #647067;
      --border: #d8ded9;

      --success: #2e7d32;
      --danger: #c62828;
      --danger-soft: #ffebee;

      --shadow-sm: 0 4px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 24px rgba(4, 106, 56, 0.08);
      --shadow-lg: 0 14px 34px rgba(4, 106, 56, 0.16);

      --radius: 14px;
      --transition: 180ms ease;
    }

    [data-theme="dark"] {
      --primary: #58b77c;
      --primary-hover: #469c67;
      --primary-soft: rgba(88, 183, 124, 0.14);
      --accent: #e6c45a;

      --bg: #161916;
      --surface: #1f241f;
      --surface-2: #242b25;
      --surface-3: #2c342d;
      --text: #eef3ee;
      --text-muted: #b0bbb1;
      --border: #39433b;

      --success: #7ecb82;
      --danger: #ff9b9b;
      --danger-soft: rgba(255, 155, 155, 0.12);

      --shadow-sm: 0 4px 8px rgba(0,0,0,0.22);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.30);
      --shadow-lg: 0 14px 34px rgba(0,0,0,0.38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 1rem 0.75rem 2rem;
      display: flex;
      justify-content: center;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .header h1 {
      margin: 0;
      color: var(--primary);
      font-size: clamp(1.8rem, 5vw, 2.3rem);
    }

    .header p {
      margin: 0.45rem 0 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      min-height: 44px;
      min-width: 44px;
      padding: 0.75rem 0.9rem;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), background-color var(--transition), border-color var(--transition);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .section-title {
      margin: 0 0 1rem;
      color: var(--primary);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .field,
    .asset-field {
      margin-bottom: 1rem;
    }

    .field:last-child,
    .asset-field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 0.45rem;
      font-weight: 600;
      color: var(--text);
    }

    .hint {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 0.9rem;
      font-size: 1rem;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition), background-color var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .asset-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.9rem;
      background: var(--surface-2);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .asset-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .asset-row-title {
      margin: 0;
      font-size: 1rem;
      color: var(--primary);
      font-weight: 700;
    }

    .asset-grid {
      display: grid;
      gap: 0.8rem;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform var(--transition), background-color var(--transition), opacity var(--transition), box-shadow var(--transition);
      min-height: 44px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      padding: 0.9rem 1.1rem;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      padding: 0.7rem 0.95rem;
    }

    .results-card {
      background: linear-gradient(135deg, var(--primary), #034f2a);
      color: #fff;
      box-shadow: var(--shadow-lg);
      border: none;
    }

    .results-card .section-title {
      color: #fff;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-label {
      opacity: 0.96;
    }

    .result-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      text-align: left;
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .khums-highlight {
      font-size: 1.5rem;
      color: #fff;
      background: var(--accent);
      padding: 0.3rem 0.95rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }

    .status-box {
      margin-top: 0.6rem;
      border-radius: 10px;
      padding: 0.95rem 1rem;
      font-weight: 600;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body {
        padding-inline: 0.55rem;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .card {
        padding: 1rem;
      }

      .result-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .result-value {
        text-align: right;
      }

      .btn-row {
        flex-direction: column;
      }

      .btn-primary {
        width: 100%;
      }

      .theme-toggle {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <header class="header">
        <h1>حاسبة الخمس</h1>
      </header>

      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="تبديل الوضع الليلي">🌙</button>
    </div>

    <section class="card" aria-labelledby="capital-title">
      <h2 id="capital-title" class="section-title">رأس المال السابق</h2>
      <div class="field">
        <label for="prev-capital">رأس المال المخمّس للسنة الفائتة</label>
        <input
          type="number"
          id="prev-capital"
          inputmode="decimal"
          min="0"
          step="any"
          placeholder="مثال: 10000"
          aria-describedby="prev-capital-hint"
        >
        <p class="hint" id="prev-capital-hint">أدخل ما تبقّى من رأس المال المخمّس من السنة الماضية.</p>
      </div>
    </section>

    <section class="card" aria-labelledby="assets-title">
      <h2 id="assets-title" class="section-title">أصول السنة الحالية</h2>
      <div id="assets-container" aria-live="polite"></div>
      <div class="btn-row">
        <button type="button" id="add-asset-btn" class="btn-primary">إضافة أصل جديد</button>
      </div>
    </section>

    <section class="card results-card" aria-labelledby="results-title">
      <h2 id="results-title" class="section-title">النتائج</h2>

      <div class="result-row">
        <span class="result-label">إجمالي الأصول الحالية</span>
        <output class="result-value" id="res-total-wealth">0</output>
      </div>

      <div class="result-row">
        <span class="result-label">الربح الصافي</span>
        <output class="result-value" id="res-net-profit">0</output>
      </div>

      <div class="result-row" id="khums-row">
        <span class="result-label">مقدار الخمس الواجب</span>
        <output class="result-value khums-highlight" id="res-khums-due">0</output>
      </div>

      <div class="result-row">
        <span class="result-label">رأس المال المخمّس القادم</span>
        <output class="result-value" style="color:#fff;" id="res-next-capital">0</output>
      </div>

      <div id="status-box" class="status-box" aria-live="polite">
        أدخل رأس المال والأصول لحساب الخمس.
      </div>
    </section>
  </main>

  <template id="asset-template">
    <article class="asset-row">
      <div class="asset-row-header">
        <h3 class="asset-row-title"></h3>
        <button type="button" class="btn-danger delete-btn">حذف</button>
      </div>

      <div class="asset-grid">
        <div class="asset-field">
          <label class="asset-name-label">اسم الأصل (اختياري)</label>
          <input type="text" class="asset-name" placeholder="مثال: نقد، حساب بنكي، بضاعة">
        </div>

        <div class="asset-field">
          <label class="asset-amount-label">قيمة الأصل</label>
          <input type="number" class="asset-amount" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>
      </div>
    </article>
  </template>

  <script>
    const assetsContainer = document.getElementById('assets-container');
    const addAssetBtn = document.getElementById('add-asset-btn');
    const prevCapitalInput = document.getElementById('prev-capital');
    const assetTemplate = document.getElementById('asset-template');
    const statusBox = document.getElementById('status-box');
    const khumsRow = document.getElementById('khums-row');
    const themeToggle = document.getElementById('theme-toggle');

    function formatNumber(value) {
      return new Intl.NumberFormat('ar-SA-u-nu-latn', {
        maximumFractionDigits: 2
      }).format(value);
    }

    function parseValue(value) {
      const parsed = parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function getAssetRows() {
      return [...assetsContainer.querySelectorAll('.asset-row')];
    }

    function updateAssetLabels() {
      const rows = getAssetRows();

      rows.forEach((row, index) => {
        const rowNum = index + 1;
        const title = row.querySelector('.asset-row-title');
        const nameLabel = row.querySelector('.asset-name-label');
        const amountLabel = row.querySelector('.asset-amount-label');
        const nameInput = row.querySelector('.asset-name');
        const amountInput = row.querySelector('.asset-amount');
        const deleteBtn = row.querySelector('.delete-btn');

        const nameId = `asset-name-${rowNum}`;
        const amountId = `asset-amount-${rowNum}`;

        title.textContent = `الأصل ${rowNum}`;
        nameLabel.setAttribute('for', nameId);
        amountLabel.setAttribute('for', amountId);
        nameInput.id = nameId;
        amountInput.id = amountId;
        deleteBtn.setAttribute('aria-label', `حذف الأصل ${rowNum}`);
      });
    }

    function setStatus(message, showKhums = true) {
      khumsRow.style.display = showKhums ? 'flex' : 'none';
      statusBox.textContent = message;
    }

    function calculateKhums() {
      const prevCapital = parseValue(prevCapitalInput.value);
      const rows = getAssetRows();

      const totalCurrentWealth = rows.reduce((sum, row) => {
        const amount = parseValue(row.querySelector('.asset-amount').value);
        return sum + amount;
      }, 0);

      const netProfit = totalCurrentWealth - prevCapital;
      const khumsDue = netProfit > 0 ? netProfit * 0.2 : 0;
      const nextCapital = totalCurrentWealth - khumsDue;

      document.getElementById('res-total-wealth').textContent = formatNumber(totalCurrentWealth);
      document.getElementById('res-net-profit').textContent = formatNumber(netProfit);
      document.getElementById('res-khums-due').textContent = formatNumber(khumsDue);
      document.getElementById('res-next-capital').textContent = formatNumber(nextCapital);

      const hasPrevCapital = prevCapitalInput.value.trim() !== '';
      const hasAnyAssetValue = rows.some(row => row.querySelector('.asset-amount').value.trim() !== '');
      const hasAnyInput = hasPrevCapital || hasAnyAssetValue;

      if (!hasAnyInput) {
        setStatus('أدخل رأس المال والأصول لحساب الخمس.', true);
        return;
      }

      if (netProfit <= 0) {
        setStatus('ليس عليك خمس لهذه السنة 🌿', false);
        return;
      }

      setStatus('تم حساب الخمس بناءً على الربح الصافي لهذه السنة.', true);
    }

    function addAssetRow({ name = '', amount = '' } = {}) {
      const fragment = assetTemplate.content.cloneNode(true);
      const row = fragment.querySelector('.asset-row');
      const nameInput = row.querySelector('.asset-name');
      const amountInput = row.querySelector('.asset-amount');
      const deleteBtn = row.querySelector('.delete-btn');

      nameInput.value = name;
      amountInput.value = amount;

      nameInput.addEventListener('input', calculateKhums);
      amountInput.addEventListener('input', calculateKhums);

      deleteBtn.addEventListener('click', () => {
        row.remove();

        if (assetsContainer.children.length === 0) {
          addAssetRow();
        }

        updateAssetLabels();
        calculateKhums();
      });

      assetsContainer.appendChild(fragment);
      updateAssetLabels();
      calculateKhums();
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      themeToggle.setAttribute(
        'aria-label',
        theme === 'dark' ? 'تبديل الوضع النهاري' : 'تبديل الوضع الليلي'
      );
    }

    function initTheme() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });
    }

    addAssetBtn.addEventListener('click', () => addAssetRow());
    prevCapitalInput.addEventListener('input', calculateKhums);

    initTheme();
    addAssetRow();
  </script>
</body>
</html>
