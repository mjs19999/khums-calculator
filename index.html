<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الخمس الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #046A38;
            --primary-light: #0a8a4d;
            --accent-color: #D4AF37;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --text-muted: #888888;
            --border-light: #cccccc;
            --danger-bg: #ffebee;
            --danger-color: #d32f2f;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(4, 106, 56, 0.08);
            --shadow-lg: 0 12px 32px rgba(4, 106, 56, 0.15);
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 1rem 0.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { color: var(--primary-color); font-size: 2.2rem; margin-bottom: 0.5rem; }
        .header p { color: var(--text-muted); font-size: 1rem; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .input-container {
            position: relative;
            margin-bottom: 1.2rem;
            width: 100%;
            animation: slideIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-input {
            width: 100%;
            padding: 1rem 0.8rem;
            padding-left: 2.5rem;
            font-size: 1rem;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background-color: transparent;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        .main-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(4, 106, 56, 0.1);
        }

        .static-label {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: var(--transition);
            transform-origin: right center;
            background-color: transparent;
            padding: 0;
            margin: 0;
        }

        input.floating-label {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            transition: var(--transition);
            transform-origin: right center;
            background-color: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            width: auto;
            max-width: 80%;
            pointer-events: auto;
            cursor: text;
        }

        .main-input:focus ~ .static-label,
        .main-input:not(:placeholder-shown) ~ .static-label,
        .main-input:focus ~ input.floating-label,
        .main-input:not(:placeholder-shown) ~ input.floating-label,
        input.floating-label:focus {
            top: 0;
            transform: translateY(-50%) scale(0.85);
            background-color: var(--card-bg);
            padding: 0 3px;
            color: var(--primary-color);
        }

        input.floating-label:focus {
            border-bottom: 1px dashed var(--primary-color);
            color: var(--primary-light);
        }

        .delete-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--danger-bg);
            color: var(--danger-color);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 1.4rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .delete-btn:hover {
            background: #ffcdd2;
            transform: translateY(-50%) scale(1.1);
        }

        .input-container:not(.ghost-row):not(.first-row) .delete-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .ghost-row { opacity: 0.4; transition: opacity 0.3s; }
        .ghost-row:hover { opacity: 0.6; }
        .ghost-row .main-input {
            border: 1px dashed var(--border-light);
            background-color: #fafafa;
        }

        .results-card {
            background: linear-gradient(135deg, var(--primary-color), #034f2a);
            color: white;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-row:last-child {
            border-bottom: none;
            margin-top: 0.5rem;
            padding-top: 1.5rem;
        }

        .result-label {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .khums-highlight {
            font-size: 1.8rem;
            color: #fff;
            background: var(--accent-color);
            padding: 0.3rem 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .no-khums-inline {
            animation: fadeIn 0.4s ease forwards;
        }

        .no-khums-inline .result-label {
            opacity: 0.95;
        }

        .no-khums-inline .result-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .main-input { font-size: 1.05rem; padding-left: 2.5rem; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>حاسبة الخمس</h1>
        </div>

        <div class="card">
            <h2 class="section-title">رأس المال السابق</h2>
            <div class="input-container">
                <input type="number" id="prev-capital" class="main-input" placeholder=" " min="0">
                <label for="prev-capital" class="static-label">رأس المال المخمس للسنة الفائتة</label>
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">أصول السنة الحالية</h2>
            <div id="assets-container"></div>
        </div>

        <div class="card results-card">
            <div id="khums-details">
                <div class="result-row">
                    <span class="result-label">إجمالي الأصول الحالية</span>
                    <span class="result-value" id="res-total-wealth">0</span>
                </div>
                <div class="result-row">
                    <span class="result-label">الربح الصافي</span>
                    <span class="result-value" id="res-net-profit">0</span>
                </div>

                <div class="result-row" id="khums-row">
                    <span class="result-label">مقدار الخمس الواجب</span>
                    <span class="result-value khums-highlight" id="res-khums-due">0</span>
                </div>

                <div class="result-row no-khums-inline" id="no-khums-row" style="display: none;">
                    <span class="result-label">الحالة</span>
                    <span class="result-value">ليس عليك خمس لهذه السنة 🌿</span>
                </div>

                <div class="result-row">
                    <span class="result-label">رأس المال المخمس القادم</span>
                    <span class="result-value" id="res-next-capital" style="color: white;">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const assetsContainer = document.getElementById('assets-container');
        const prevCapitalInput = document.getElementById('prev-capital');
        let sourceCounter = 1;

        function init() {
            assetsContainer.appendChild(createRow(false, true));
            assetsContainer.appendChild(createRow(true, false));
            prevCapitalInput.addEventListener('input', calculateKhums);
            calculateKhums();
        }

        function formatCurrency(num) {
            return num.toLocaleString('en-US');
        }

        function createRow(isGhost = false, isFirst = false) {
            const container = document.createElement('div');
            container.className = `input-container ${isGhost ? 'ghost-row' : ''} ${isFirst ? 'first-row' : ''}`;

            const currentSourceNum = sourceCounter;
            sourceCounter++;

            const amountInput = document.createElement('input');
            amountInput.type = 'number';
            amountInput.className = 'main-input asset-amount';
            amountInput.placeholder = ' ';
            amountInput.min = '0';

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'floating-label asset-name';
            nameInput.value = `أصول ${currentSourceNum}`;

            const deleteBtn = document.createElement('button');
            deleteBtn.type = 'button';
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '−';
            deleteBtn.tabIndex = -1;

            deleteBtn.addEventListener('click', () => {
                if (isFirst) return;
                container.style.opacity = '0';
                container.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    container.remove();
                    calculateKhums();
                }, 250);
            });

            const adjustLabelWidth = () => {
                let ruler = document.getElementById('text-ruler');
                if (!ruler) {
                    ruler = document.createElement('span');
                    ruler.id = 'text-ruler';
                    ruler.style.cssText = 'position:absolute; visibility:hidden; white-space:pre; font-size:1.1rem; font-family:"Tajawal", sans-serif;';
                    document.body.appendChild(ruler);
                }
                ruler.textContent = nameInput.value || nameInput.placeholder;
                nameInput.style.width = (ruler.offsetWidth + 12) + 'px';
            };

            const handleActivation = () => {
                if (container.classList.contains('ghost-row')) {
                    container.classList.remove('ghost-row');
                    assetsContainer.appendChild(createRow(true, false));
                }
                calculateKhums();
            };

            nameInput.addEventListener('blur', () => {
                if (nameInput.value.trim() === '') {
                    nameInput.value = `أصول ${currentSourceNum}`;
                    adjustLabelWidth();
                }
            });

            amountInput.addEventListener('input', handleActivation);
            nameInput.addEventListener('focus', () => {
                nameInput.select();
                handleActivation();
            });
            nameInput.addEventListener('input', handleActivation);
            nameInput.addEventListener('input', adjustLabelWidth);
            requestAnimationFrame(adjustLabelWidth);

            container.appendChild(amountInput);
            container.appendChild(nameInput);
            container.appendChild(deleteBtn);

            return container;
        }

        function calculateKhums() {
            const prevCapital = parseFloat(prevCapitalInput.value) || 0;
            let totalCurrentWealth = 0;

            const rows = assetsContainer.querySelectorAll('.input-container:not(.ghost-row)');
            rows.forEach(row => {
                const amountInput = row.querySelector('.asset-amount');
                const amount = parseFloat(amountInput.value) || 0;
                totalCurrentWealth += amount;
            });

            const netProfit = totalCurrentWealth - prevCapital;
            let khumsDue = 0;

            if (netProfit > 0) {
                khumsDue = netProfit / 5;
            }

            const nextCapital = totalCurrentWealth - khumsDue;
            updateUI(totalCurrentWealth, netProfit, khumsDue, nextCapital);
        }

        function updateUI(totalCurrentWealth, netProfit, khumsDue, nextCapital) {
            document.getElementById('res-total-wealth').innerText = formatCurrency(totalCurrentWealth);
            document.getElementById('res-net-profit').innerText = formatCurrency(netProfit);
            document.getElementById('res-khums-due').innerText = formatCurrency(khumsDue);
            document.getElementById('res-next-capital').innerText = formatCurrency(nextCapital);

            const khumsRow = document.getElementById('khums-row');
            const noKhumsRow = document.getElementById('no-khums-row');

            if (netProfit <= 0 && totalCurrentWealth > 0) {
                khumsRow.style.display = 'none';
                noKhumsRow.style.display = 'flex';
            } else {
                khumsRow.style.display = 'flex';
                noKhumsRow.style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
