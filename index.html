<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة الخمس الذكية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #046A38;
      --primary-light: #0a8a4d;
      --accent-color: #D4AF37;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --text-muted: #6f6f6f;
      --border-light: #d7d7d7;
      --danger-bg: #ffebee;
      --danger-color: #c62828;
      --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 24px rgba(4, 106, 56, 0.08);
      --shadow-lg: 0 12px 32px rgba(4, 106, 56, 0.15);
      --transition: 180ms ease;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 1rem 0.75rem 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      margin: 0;
      color: var(--primary-color);
      font-size: clamp(1.8rem, 5vw, 2.3rem);
    }

    .header p {
      margin: 0.5rem 0 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .section-title {
      margin: 0 0 1rem;
      color: var(--primary-color);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .field,
    .asset-field {
      margin-bottom: 1rem;
    }

    .field:last-child,
    .asset-field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 0.45rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .hint {
      margin-top: 0.35rem;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 0.95rem 0.9rem;
      font-size: 1rem;
      background: #fff;
      color: var(--text-main);
      transition: border-color var(--transition), box-shadow var(--transition), background-color var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(4, 106, 56, 0.12);
    }

    .asset-row {
      border: 1px solid #ececec;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.9rem;
      background: #fcfcfc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .asset-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .asset-row-title {
      margin: 0;
      font-size: 1rem;
      color: var(--primary-color);
      font-weight: 700;
    }

    .asset-grid {
      display: grid;
      gap: 0.8rem;
    }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    button {
      font: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform var(--transition), background-color var(--transition), opacity var(--transition), box-shadow var(--transition);
      min-height: 44px;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 3px;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #fff;
      padding: 0.9rem 1.1rem;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover { background: var(--primary-light); }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-color);
      padding: 0.7rem 0.95rem;
    }

    .results-card {
      background: linear-gradient(135deg, var(--primary-color), #034f2a);
      color: #fff;
      box-shadow: var(--shadow-lg);
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .result-row:last-child { border-bottom: none; }

    .result-label { opacity: 0.95; }

    .result-value {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--accent-color);
      text-align: left;
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .khums-highlight {
      font-size: 1.55rem;
      color: #fff;
      background: var(--accent-color);
      padding: 0.3rem 0.95rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    }

    .status-box {
      margin-top: 0.4rem;
      border-radius: 10px;
      padding: 0.95rem 1rem;
      font-weight: 600;
      display: none;
    }

    .status-box.info {
      display: block;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .status-box.success {
      display: block;
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body { padding-inline: 0.55rem; }
      .card { padding: 1rem; }
      .result-row { align-items: flex-start; flex-direction: column; }
      .result-value { text-align: right; }
      .btn-row { flex-direction: column; }
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>حاسبة الخمس</h1>
      <p>نسخة أوضح وأسهل استخدامًا مع دعم أفضل للوصول وإدخال الأصول.</p>
    </header>

    <section class="card" aria-labelledby="capital-title">
      <h2 id="capital-title" class="section-title">رأس المال السابق</h2>
      <div class="field">
        <label for="prev-capital">رأس المال المخمس للسنة الفائتة</label>
        <input type="number" id="prev-capital" inputmode="decimal" min="0" step="any" placeholder="مثال: 10000" aria-describedby="prev-capital-hint">
        <p class="hint" id="prev-capital-hint">أدخل ما تبقى من رأس المال المخمس من السنة الماضية.</p>
      </div>
    </section>

    <section class="card" aria-labelledby="assets-title">
      <h2 id="assets-title" class="section-title">أصول السنة الحالية</h2>
      <div id="assets-container" aria-live="polite"></div>
      <div class="btn-row">
        <button type="button" id="add-asset-btn" class="btn-primary">إضافة أصل جديد</button>
      </div>
    </section>

    <section class="card results-card" aria-labelledby="results-title">
      <h2 id="results-title" class="section-title" style="color:#fff;">النتائج</h2>

      <div class="result-row">
        <span class="result-label">إجمالي الأصول الحالية</span>
        <output class="result-value" id="res-total-wealth" for="prev-capital">0</output>
      </div>

      <div class="result-row">
        <span class="result-label">الربح الصافي</span>
        <output class="result-value" id="res-net-profit" for="prev-capital">0</output>
      </div>

      <div class="result-row" id="khums-row">
        <span class="result-label">مقدار الخمس الواجب</span>
        <output class="result-value khums-highlight" id="res-khums-due" for="prev-capital">0</output>
      </div>

      <div class="result-row">
        <span class="result-label">رأس المال المخمس القادم</span>
        <output class="result-value" style="color:#fff;" id="res-next-capital" for="prev-capital">0</output>
      </div>

      <div id="status-box" class="status-box info" aria-live="polite">
        أدخل رأس المال والأصول لحساب الخمس.
      </div>
    </section>
  </main>

  <template id="asset-template">
    <article class="asset-row">
      <div class="asset-row-header">
        <h3 class="asset-row-title"></h3>
        <button type="button" class="btn-danger delete-btn">حذف</button>
      </div>
      <div class="asset-grid">
        <div class="asset-field">
          <label class="asset-name-label">اسم الأصل (اختياري)</label>
          <input type="text" class="asset-name" placeholder="مثال: نقد، حساب بنكي، بضاعة">
        </div>
        <div class="asset-field">
          <label class="asset-amount-label">قيمة الأصل</label>
          <input type="number" class="asset-amount" inputmode="decimal" min="0" step="any" placeholder="0" />
        </div>
      </div>
    </article>
  </template>

  <script>
    const assetsContainer = document.getElementById('assets-container');
    const addAssetBtn = document.getElementById('add-asset-btn');
    const prevCapitalInput = document.getElementById('prev-capital');
    const assetTemplate = document.getElementById('asset-template');
    const statusBox = document.getElementById('status-box');

    let assetCounter = 0;

    function formatNumber(value) {
      return new Intl.NumberFormat('ar-SA-u-nu-latn', {
        maximumFractionDigits: 2
      }).format(value);
    }

    function parseValue(value) {
      const parsed = parseFloat(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function updateAssetLabels() {
      const rows = [...assetsContainer.querySelectorAll('.asset-row')];
      rows.forEach((row, index) => {
        const rowNum = index + 1;
        const title = row.querySelector('.asset-row-title');
        const nameLabel = row.querySelector('.asset-name-label');
        const amountLabel = row.querySelector('.asset-amount-label');
        const nameInput = row.querySelector('.asset-name');
        const amountInput = row.querySelector('.asset-amount');
        const deleteBtn = row.querySelector('.delete-btn');

        const nameId = `asset-name-${rowNum}`;
        const amountId = `asset-amount-${rowNum}`;

        title.textContent = `الأصل ${rowNum}`;
        nameLabel.setAttribute('for', nameId);
        amountLabel.setAttribute('for', amountId);
        nameInput.id = nameId;
        amountInput.id = amountId;
        amountInput.setAttribute('aria-describedby', 'results-title');
        deleteBtn.setAttribute('aria-label', `حذف الأصل ${rowNum}`);
      });
    }

    function addAssetRow({ name = '', amount = '' } = {}) {
      const fragment = assetTemplate.content.cloneNode(true);
      const row = fragment.querySelector('.asset-row');
      const nameInput = row.querySelector('.asset-name');
      const amountInput = row.querySelector('.asset-amount');
      const deleteBtn = row.querySelector('.delete-btn');

      assetCounter += 1;
      nameInput.value = name;
      amountInput.value = amount;

      nameInput.addEventListener('input', calculateKhums);
      amountInput.addEventListener('input', calculateKhums);

      deleteBtn.addEventListener('click', () => {
        row.remove();
        updateAssetLabels();
        if (assetsContainer.children.length === 0) {
          addAssetRow();
        }
        calculateKhums();
      });

      assetsContainer.appendChild(fragment);
      updateAssetLabels();
      calculateKhums();
    }

    function calculateKhums() {
      const prevCapital = parseValue(prevCapitalInput.value);
      const rows = [...assetsContainer.querySelectorAll('.asset-row')];
      const totalCurrentWealth = rows.reduce((sum, row) => {
        const amount = parseValue(row.querySelector('.asset-amount').value);
        return sum + amount;
      }, 0);

      const netProfit = totalCurrentWealth - prevCapital;
      const khumsDue = netProfit > 0 ? netProfit / 5 : 0;
      const nextCapital = totalCurrentWealth - khumsDue;

      document.getElementById('res-total-wealth').textContent = formatNumber(totalCurrentWealth);
      document.getElementById('res-net-profit').textContent = formatNumber(netProfit);
      document.getElementById('res-khums-due').textContent = formatNumber(khumsDue);
      document.getElementById('res-next-capital').textContent = formatNumber(nextCapital);

      const hasPrevCapital = prevCapitalInput.value.trim() !== '';
      const hasAnyAssetValue = rows.some(row => row.querySelector('.asset-amount').value.trim() !== '');
      const hasAnyInput = hasPrevCapital || hasAnyAssetValue;
      const khumsRow = document.getElementById('khums-row');

      if (!hasAnyInput) {
        khumsRow.style.display = 'flex';
        statusBox.className = 'status-box info';
        statusBox.textContent = 'أدخل رأس المال والأصول لحساب الخمس.';
        return;
      }

      if (netProfit <= 0) {
        khumsRow.style.display = 'none';
        statusBox.className = 'status-box success';
        statusBox.textContent = 'ليس عليك خمس لهذه السنة 🌿';
        return;
      }

      khumsRow.style.display = 'flex';
      statusBox.className = 'status-box info';
      statusBox.textContent = 'تم حساب الخمس بناءً على الربح الصافي لهذه السنة.';
    }

    addAssetBtn.addEventListener('click', () => addAssetRow());
    prevCapitalInput.addEventListener('input', calculateKhums);

    addAssetRow();
  </script>
</body>
</html>
